name: Publish cinema performance report

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: ${{ hashFiles('rooz-cinema-1405-07-01.pdf.pdf') != '' }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        if: ${{ hashFiles('rooz-cinema-1405-07-01.pdf.pdf') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: ${{ hashFiles('rooz-cinema-1405-07-01.pdf.pdf') != '' }}
        id: deployment
        uses: actions/deploy-pages@v4
